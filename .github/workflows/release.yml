name: Prepare release artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Configure anonymous release identity
        run: |
          git config user.name "Leyline Contributors"
          git config user.email "contributors@leyline.invalid"
      - run: brew install jq
      - run: scripts/development/setup-oracle-jq.sh
      - run: bin/leylined-build --tests
      - run: bin/leyline-recovery-app-build --tests
      - run: bin/ley test all
      - name: Build anonymous artifacts without publishing
        run: python3 scripts/release/package_release.py --arch universal --anonymous-history --repository "https://github.com/${{ github.repository }}" --output dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: leyline-v1-preview
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.rb
            dist/SHA256SUMS
            dist/release-report.json
          if-no-files-found: error
